<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PDP Page Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: three-pane workbench. Outline left, live preview centre, inspector right; stacks on phones. */
:root {
  --bg: #f4f1ec; --surface: #ffffff; --raised: #faf8f5; --line: #e2dbd2; --fg: #221c16;
  --muted: #6e6359; --accent: #9a5d22; --accent-soft: #f3e6d8; --accent-fg: #ffffff;
  --stage: #e7e2db; --ok: #2f7a4a; --warn: #a3620b; --danger: #b3362b;
  --sans: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #16130f; --surface: #201c17; --raised: #26211b; --line: #3a322a; --fg: #efe8df;
  --muted: #a79a8c; --accent: #d79a5c; --accent-soft: #3a2b1d; --accent-fg: #1b130b;
  --stage: #0e0c0a; --ok: #6cc28f; --warn: #e2a64f; --danger: #ec7b70; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #16130f; --surface: #201c17; --raised: #26211b; --line: #3a322a; --fg: #efe8df;
  --muted: #a79a8c; --accent: #d79a5c; --accent-soft: #3a2b1d; --accent-fg: #1b130b;
  --stage: #0e0c0a; --ok: #6cc28f; --warn: #e2a64f; --danger: #ec7b70; color-scheme: dark }

* { box-sizing: border-box }
.ico { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; vertical-align: -3px }
.ico.sm { width: 13px; height: 13px; vertical-align: -2px }
.btn, .seg button, .tabs button { display: inline-flex; align-items: center; gap: 6px }
.btn.icon-only { padding: 6px 8px }
.brand .mark { width: 26px; height: 26px; border-radius: 7px; background: var(--accent); display: inline-grid; place-items: center; margin-right: 2px; align-self: center; transition: transform .3s }
.brand:hover .mark { transform: rotate(-8deg) scale(1.05) }
.brand .mark svg { width: 16px; height: 16px; fill: var(--accent-fg); stroke: none; opacity: .95 }
.chip { display: flex; align-items: center; gap: 8px }
.chip .ico { color: var(--accent); transition: transform .2s }
.chip:hover .ico { transform: scale(1.18) rotate(-6deg) }
.chip-new { grid-column: 1 / -1; border-style: solid; border-color: var(--accent); background: var(--accent-soft); font-weight: 600; justify-content: center }
.row .t { display: flex; align-items: center; gap: 6px }
.row .t .ico { color: var(--accent) }
.row .acts button .ico { width: 14px; height: 14px }
.insp .blockhead h3 { display: flex; align-items: center; gap: 8px }
.hico { width: 30px; height: 30px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); display: inline-grid; place-items: center; animation: pop .3s ease-out }
.etag { display: inline-flex; align-items: center; gap: 4px }
.addel .ico { color: var(--accent) }
.addel:hover { border-color: var(--accent); background: var(--accent-soft) }
details.item > summary button .ico { width: 14px; height: 14px }
.toast { display: flex; align-items: center; gap: 8px }
.toast .ico { color: var(--ok) }
body.theming, body.theming * { transition: background-color .35s, color .35s, border-color .35s !important }
@media (max-width: 1100px) { .hide-sm { display: none } }
[hidden] { display: none !important }
html, body { height: 100% }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 var(--sans) }
button, input, textarea, select { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
code, .mono { font-family: var(--mono); font-size: 12px }

.app { height: 100%; display: grid; grid-template-rows: auto 1fr }
header.bar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--line); background: var(--surface);
}
.brand { font-weight: 700; letter-spacing: .01em; display: flex; align-items: baseline; gap: 8px }
.brand small { color: var(--muted); font-weight: 500 }
.sku { display: flex; align-items: center; gap: 8px }
.sku label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600 }
.sku input { width: 110px; font-family: var(--mono); font-size: 14px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--raised) }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden }
.seg button { border: 0; background: transparent; padding: 6px 10px; color: var(--muted) }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--fg); font-weight: 600 }
.seg button:disabled { opacity: .4; cursor: default }
.spacer { flex: 1 }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 7px; padding: 6px 12px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap }
.btn:hover { border-color: var(--muted) }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 600 }
.btn.sm { padding: 3px 8px; font-size: 12px }
.btn.ghost { border-color: transparent; background: transparent }
.btn.danger { color: var(--danger) }

.work { min-height: 0; display: grid; grid-template-columns: 260px minmax(0, 1fr) 360px }
.pane { min-height: 0; overflow: auto; background: var(--surface) }
.left { border-right: 1px solid var(--line) }
.right { border-left: 1px solid var(--line) }
.pane h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); margin: 0; padding: 14px 14px 8px; font-weight: 700 }

.lib { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 0 12px 12px }
.chip { border: 1px dashed var(--line); background: var(--raised); border-radius: 7px; padding: 7px 8px; text-align: left; font-size: 12.5px; line-height: 1.25; cursor: grab }
.chip:hover { border-color: var(--accent); border-style: solid }
.hint { color: var(--muted); font-size: 12px; padding: 0 14px 10px; margin: 0 }

.outline { list-style: none; margin: 0; padding: 0 8px 16px; position: relative; min-height: 60px }
.row { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; align-items: center; gap: 6px; padding: 7px 6px; border-radius: 7px; border: 1px solid transparent; cursor: pointer; margin-bottom: 2px }
.row:hover { background: var(--raised) }
.row.sel { background: var(--accent-soft); border-color: var(--accent) }
.row .grip { color: var(--muted); cursor: grab; font-size: 13px; text-align: center; user-select: none }
.row .lbl { min-width: 0 }
.row .t { font-weight: 600; font-size: 13px }
.row .s .hid { color: var(--warn); font-weight: 600 }
.row .s { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.row .acts { display: flex; gap: 0; opacity: .55 }
.row:hover .acts, .row.sel .acts { opacity: 1 }
.row .acts button { border: 0; background: transparent; padding: 2px 4px; color: var(--muted); font-size: 13px; border-radius: 4px }
.row .acts button:hover { color: var(--fg); background: var(--surface) }
.drop-line { height: 3px; background: var(--accent); border-radius: 2px; margin: -1px 4px 1px }
.row.dragging { opacity: .4 }

.center { min-height: 0; display: grid; grid-template-rows: auto auto 1fr; background: var(--stage) }
.stagebar { display: flex; align-items: center; gap: 10px; padding: 8px 14px; color: var(--muted); font-size: 12px; border-bottom: 1px solid var(--line); background: var(--surface) }
.stage { min-height: 0; overflow: hidden; position: relative; padding: 16px }
.frame-wrap { margin: 0 auto; transform-origin: top left; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 8px 30px rgba(0,0,0,.08) }
.frame-wrap iframe { display: block; border: 0; background: #fff }

.tabs { display: flex; gap: 4px; padding: 10px 12px 0; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--surface); z-index: 2 }
.tabs button { border: 0; background: transparent; padding: 8px 10px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; font-weight: 600 }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent) }
.insp { padding: 16px; display: flex; flex-direction: column; gap: 16px }
.insp .blockhead { display: flex; align-items: baseline; justify-content: space-between; gap: 8px }
.insp .blockhead h3 { margin: 0; font-size: 16px }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0 }
.field > label, .field > .flabel { font-size: 12px; font-weight: 600 }
.fhint, .field .fhint { font-size: 11.5px; color: var(--muted); line-height: 1.45 }
.field input[type=text], .field textarea, .field input[type=url] { width: 100%; border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; background: var(--raised) }
.field textarea { min-height: 96px; resize: vertical; line-height: 1.45 }
.check { display: flex; gap: 8px; align-items: center; font-size: 13px }

.slot { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 10px; padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--raised) }
.slot.over { border-color: var(--accent); background: var(--accent-soft) }
.thumb { width: 76px; height: 64px; border-radius: 5px; overflow: hidden; background: var(--stage); display: grid; place-items: center; color: var(--muted); font-size: 11px; text-align: center }
.thumb img { width: 100%; height: 100%; object-fit: contain }
.slot .meta { min-width: 0; display: flex; flex-direction: column; gap: 4px }
.slot .top { display: flex; align-items: center; gap: 6px; flex-wrap: wrap }
.slot .fl { font-size: 12px; font-weight: 600 }
.badge { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; padding: 1px 6px; border-radius: 99px; border: 1px solid currentColor }
.badge.new { color: var(--ok) } .badge.existing { color: var(--muted) } .badge.empty { color: var(--warn) }
.slot code { overflow-wrap: anywhere; color: var(--fg) }
.slot .acts { display: flex; gap: 6px; flex-wrap: wrap }
.slot .fn { width: 100%; border: 1px solid var(--line); border-radius: 5px; padding: 4px 7px; background: var(--surface); font-family: var(--mono); font-size: 11.5px }

details.item.flash { animation: flash 1.2s ease-out }
@keyframes flash { 0%, 30% { box-shadow: 0 0 0 3px var(--accent, #c27a35) } 100% { box-shadow: 0 0 0 0 transparent } }
details.item { border: 1px solid var(--line); border-radius: 8px; background: var(--surface) }
details.item > summary { display: flex; align-items: center; gap: 8px; padding: 8px 10px; cursor: pointer; list-style: none }
details.item > summary::-webkit-details-marker { display: none }
details.item > summary .n { font-family: var(--mono); font-size: 11px; color: var(--muted) }
details.item > summary .tt { flex: 1; min-width: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
details.item > summary button { border: 0; background: transparent; color: var(--muted); padding: 2px 5px; border-radius: 4px }
details.item > summary button:hover { color: var(--fg); background: var(--raised) }
details.item[open] > summary { border-bottom: 1px solid var(--line) }
details.item .body { padding: 10px; display: flex; flex-direction: column; gap: 12px }
.list { display: flex; flex-direction: column; gap: 8px }
.corners { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; padding: 8px; border: 1px dashed var(--line); border-radius: 8px }
.corners label { display: flex; align-items: center; gap: 5px; font-size: 12px }
.corners span { color: var(--accent); font-size: 14px; width: 14px }
.corners input { width: 60px; border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; background: var(--raised) }
.icoitem { border: 1px solid var(--line); border-radius: 8px; padding: 8px; display: flex; flex-direction: column; gap: 8px; background: var(--surface) }
.icohead { display: flex; align-items: center; gap: 4px }
.icohead .n { font-family: var(--mono); font-size: 11px; color: var(--muted) }
.poscard { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 10px; background: var(--raised) }
.poshead { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 12.5px; color: var(--accent) }
.divprev { height: 34px; display: flex; align-items: center; justify-content: center; border: 1px dashed var(--line); border-radius: 8px; background: var(--surface); padding: 0 12px }
.divprev i { display: block; max-width: 100% }
.seg-full { display: flex; width: 100% }
.seg-full > button { flex: 1 1 0; justify-content: center; min-width: 0 }
.showon > button { gap: 5px; padding: 6px 4px }
.showon > button[aria-pressed="false"] { color: var(--muted); text-decoration: line-through; opacity: .7 }
.showon > button[aria-pressed="true"] .ico { color: var(--accent) }
.chk-head { font-weight: 700; padding: 8px 12px; border-radius: 8px; font-size: 14px }
.chk-head.good { background: color-mix(in srgb, var(--ok) 15%, transparent); color: var(--ok) }
.chk-head.meh { background: color-mix(in srgb, var(--warn) 15%, transparent); color: var(--warn) }
.chk-head.bad { background: color-mix(in srgb, var(--danger) 15%, transparent); color: var(--danger) }
.checks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; max-height: 240px; overflow: auto }
.checks li { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; font-size: 13px; background: var(--raised) }
.checks li.error { border-color: var(--danger) }
.checks li b { margin-right: 4px }
.optbox { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px }
.optrow { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; font-size: 13px }
.optrow select { border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; background: var(--raised) }
.angles { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px }
.angles button { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 3px 0 2px; display: flex; flex-direction: column; align-items: center; font-size: 14px; line-height: 1.1; color: var(--fg) }
.angles button small { font-size: 9.5px; color: var(--muted) }
.angles button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft) }
.angles button:hover { border-color: var(--muted) }
.slottip { font-size: 11px; line-height: 1.45; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: 6px; padding: 6px 8px }
.slottip code { font-size: 10.5px; overflow-wrap: anywhere; color: var(--fg) }
.slottip b { color: var(--accent) }
.gradprev { height: 28px; border-radius: 6px; border: 1px solid var(--line) }
.splitlbl { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted) }
.splitlbl b { color: var(--fg) }
input[type=range] { width: 100%; accent-color: var(--accent) }
.rte { min-height: 2.6em; max-height: 320px; overflow: auto; border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; background: var(--raised); line-height: 1.45; outline: none; overflow-wrap: anywhere }
.rte.tall { min-height: 7em }
.rte:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft) }
.rte ul, .rte ol { margin: 4px 0; padding-left: 22px }
.rte a { color: var(--accent) }
.linkbar { display: flex; gap: 6px; flex-wrap: wrap }
.linkbar input { flex: 1; min-width: 140px; border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; background: var(--raised) }
.tbar { display: flex; gap: 4px; flex-wrap: wrap }
.tbar button { border: 1px solid var(--line); background: var(--surface); border-radius: 5px; padding: 2px 8px; font-size: 12px; min-width: 28px }
.tbar button:hover { border-color: var(--muted) }
.addbar { display: flex; flex-wrap: wrap; gap: 5px; align-items: center }
.addbar > span { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; margin-right: 2px }
.etag { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--accent); min-width: 62px }
details.el > summary .tt { font-weight: 500 }
.posrow { display: flex; gap: 14px; align-items: flex-start; flex-wrap: wrap }
.grid9 { display: grid; grid-template-columns: repeat(3, 30px); gap: 4px; padding: 6px; border: 1px solid var(--line); border-radius: 8px; background: var(--stage) }
.grid9 button { width: 30px; height: 26px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); display: grid; place-items: center; padding: 0 }
.grid9 button i { width: 10px; height: 4px; border-radius: 2px; background: var(--line) }
.grid9 button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft) }
.grid9 button[aria-pressed="true"] i { background: var(--accent) }
.pads { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; font-size: 12px }
.pads label { display: flex; flex-direction: column; gap: 3px }
.pads input { width: 64px; border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; background: var(--raised) }
.psum { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 55% }
.prow { display: grid; grid-template-columns: 76px minmax(0, 1fr); align-items: center; gap: 8px; font-size: 12.5px }
.prow select, .pin input[type=number] { border: 1px solid var(--line); border-radius: 6px; padding: 5px 7px; background: var(--raised); min-width: 0 }
.pin { display: flex; gap: 6px; align-items: center; min-width: 0 }
.pin input[type=number] { width: 90px }
.pin input[type=color] { width: 40px; height: 28px; border: 1px solid var(--line); border-radius: 5px; padding: 0; background: none }
.prow .seg button { padding: 4px 8px; font-size: 12px }

.colors { display: grid; grid-template-columns: 1fr; gap: 8px }
.colorrow { display: grid; grid-template-columns: 36px minmax(0, 1fr) 88px; align-items: center; gap: 8px; font-size: 12.5px }
.colorrow input[type=color] { width: 36px; height: 28px; border: 1px solid var(--line); border-radius: 5px; padding: 0; background: none }
.colorrow input[type=text] { font-family: var(--mono); font-size: 12px; border: 1px solid var(--line); border-radius: 5px; padding: 4px 6px; background: var(--raised); width: 100% }
.cheat { font-size: 12px; color: var(--muted); background: var(--raised); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; line-height: 1.6 }
.cheat code { color: var(--fg) }

.modal { position: fixed; inset: 0; background: rgba(20,14,8,.45); display: grid; place-items: center; z-index: 20; padding: 16px }
.dialog { width: min(720px, 100%); max-height: 88vh; overflow: auto; background: var(--surface); border-radius: 12px; border: 1px solid var(--line); padding: 20px; display: flex; flex-direction: column; gap: 14px }
.dialog h3 { margin: 0; font-size: 18px }
.ftable-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px }
.ftable { width: 100%; border-collapse: collapse; font-size: 12.5px }
.ftable th, .ftable td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--line); vertical-align: top }
.ftable th { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted) }
.ftable tr:last-child td { border-bottom: 0 }
.warns { margin: 0; padding: 10px 12px 10px 28px; border-radius: 8px; background: var(--accent-soft); color: var(--fg); font-size: 13px }
.dialog .acts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end }
.status { font-size: 12.5px; color: var(--muted); min-height: 1.2em }

.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 13px; z-index: 30 }

@media (max-width: 1100px) { .work { grid-template-columns: 230px minmax(0, 1fr) 320px } }
@media (max-width: 900px) {
  .app { height: auto; display: block }
  .work { display: flex; flex-direction: column }
  .pane { overflow: visible }
  .left, .right { border: 0; border-bottom: 1px solid var(--line) }
  .center { height: 72vh; order: 0 }
  .left { order: 1 } .right { order: 2 }
}
/* Motion: short, purposeful, off for reduced-motion users */
@keyframes rise { from { opacity: 0; transform: translateY(6px) } }
@keyframes pop { 0% { transform: scale(.96); opacity: 0 } 100% { transform: none; opacity: 1 } }
@keyframes flash { 0% { box-shadow: 0 0 0 3px var(--accent) } 100% { box-shadow: 0 0 0 0 transparent } }
@keyframes ping { 0% { transform: scale(1); opacity: .9 } 100% { transform: scale(2.6); opacity: 0 } }
@keyframes slideUp { from { opacity: 0; transform: translate(-50%, 12px) } }
@keyframes slideDown { to { opacity: 0; transform: translate(-50%, 12px) } }
@keyframes glow { 50% { opacity: .35 } }
.btn, .chip, .row, .seg button, .tabs button, .tbar button, .grid9 button, details.item > summary button, .slot, .thumb img { transition: background-color .18s, border-color .18s, color .18s, transform .18s, box-shadow .18s, opacity .18s }
.btn:active, .chip:active, .tbar button:active, .grid9 button:active { transform: scale(.96) }
.btn.primary:hover { box-shadow: 0 4px 14px -4px var(--accent) }
.chip:hover { transform: translateY(-1px); box-shadow: 0 6px 14px -8px rgba(0,0,0,.35) }
.row.enter { animation: rise .3s ease-out, flash .9s ease-out .1s }
.row.sel { box-shadow: inset 3px 0 0 var(--accent) }
.insp.enter > * { animation: rise .26s ease-out both }

const SAMPLE_TEXT = ['Shop now', 'PRODUCT NAME', 'Short line about the product.', 'Paragraph text.', 'Title', 'Headline', 'Your text here.', 'Feature title', 'Feature description.', 'Tagline', 'BRAND: Who We Are', 'About the brand.', 'Describe the product here.', 'NEW ITEM'];
const SAMPLE_BITS = ['Volume: 50ml', 'Shake well before use.', 'Water, Glycerin, Butylene Glycol, Niacinamide', 'Adults looking for a simple, effective daily routine.'];
function runChecks() {
  const out = [], names = autoNames(st), add = (lvl, msg, b) => out.push({ lvl, msg, bid: b && b.id, where: b ? `${TYPES[b.type].label} #${st.blocks.indexOf(b) + 1}` : 'Page' });
  const sample = v => { const x = String(v || '').replace(/[*]/g, '').trim(); return SAMPLE_TEXT.includes(x) || SAMPLE_BITS.some(s => x.includes(s)); };
  const deadLink = v => /\]\(\s*#?\s*\)/.test(String(v || ''));
  if (!st.sku || !/^[\w-]+$/.test(st.sku.trim())) add('error', 'SKU is missing or has spaces/symbols. File names are built from it.');
  if (!st.blocks.length) add('error', 'The page has no sections.');
  if (!(st.title || '').trim()) add('warn', 'Page title is empty (Page settings).');
  if (!(st.desc || '').trim()) add('warn', 'Meta description is empty (Page settings). Search engines and link previews use it.');
  const els = (b, list) => (list || []).forEach(el => {
    const lbl = (EL[el.t] || {}).label || 'Element';
    if ((EL[el.t] || {}).text) {
      if (sample(el.v)) add('warn', `${lbl} still has sample text: “${String(el.v).replace(/[*]/g, '').split('\n')[0].slice(0, 60)}”`, b);
      if (deadLink(el.v)) add('warn', `${lbl} has a link with no address.`, b);
    } else if (el.t === 'button') {
      if (sample(el.v)) add('warn', `Button text is still “${el.v}”.`, b);
      if (!/^(https?:|mailto:|tel:)/i.test((el.href || '').trim())) add('warn', `Button “${el.v}” has no link.`, b);
    } else if (el.t === 'icons') {
      (el.items || []).forEach((it, i) => { if (!resolveSlot(it.img, it.id, names, assets, 'icon')) add('warn', `Icon row: icon ${i + 1} has no image.`, b); });
    } else if (EL[el.t] && EL[el.t].img) {

      else if (el.t !== 'icon' && !(el.v || '').trim()) add('info', `${lbl} has no description (alt text).`, b);
    }

    const d = b.data;
    if (b.type === 'hero' || b.type === 'banner' || b.type === 'image') {
      if (!resolveSlot(d.desk, b.id + '.desk', names, assets, 'desk')) add(b.type === 'image' ? 'warn' : 'error', 'Desktop image is missing.', b);
      if (b.type !== 'hero' && !(d.alt || '').trim()) add('info', 'Image has no description (alt text).', b);
    }
    if (b.type === 'video' && !ytEmbed(d.url)) add('warn', 'No YouTube link.', b);
    if (d.els) els(b, d.els);
    if (d.head) els(b, d.head);

    if (b.type === 'columns') d.cols.forEach(c => els(b, c.els));
    if (b.type === 'cards') d.cards.forEach((cd, i) => { if (!resolveSlot(cd.img, cd.id, names, assets, 'image')) add('warn', `Card ${i + 1} has no image.`, b); els(b, cd.els); });
    if (b.type === 'moreinfo') d.items.forEach(it => {
      if (sample(it.body) || sample(it.specs)) add('warn', `“${it.title}” still has sample text.`, b);
      if (deadLink(it.body)) add('warn', `“${it.title}” has a link with no address.`, b);

  for (const f of buildHTML(st, assets, {}).files.values()) if (f.same) add('info', `${f.name} matches a file already on the server, so the page uses that one and the zip skips it.`);

  for (const c of out) { const k = c.lvl + c.where + c.msg; if (seen.has(k)) seen.get(k).n++; else seen.set(k, Object.assign(c, { n: 1 })); }

async function optimise(blob, name, o) {
  if (!/^image\/(jpeg|png|webp)$/.test(blob.type)) return blob;
  const bmp = await createImageBitmap(blob);
  const maxW = /_mb_/.test(name) ? Math.min(+o.maxW, 1080) : +o.maxW, s = Math.min(1, maxW / bmp.width);
  if (s === 1 && blob.type === 'image/png') return blob;
  const c = document.createElement('canvas'); c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);

  return out && out.size < blob.size ? out : blob;
}

        <span class="fhint">Mobile images (_mb_) are capped at 1080px. PNGs are only resized. Names stay the same.</span>
      </div>
    </div>
    <p style="margin:0" class="fhint">The .zip holds <code>${esc(sku)}_en.html</code> and <code>assets/img/</code> with your new uploads. <b>On server</b> files are referenced, not included. Your existing <code>assets/css</code> and <code>assets/js</code> are referenced, not included.</p>
    <div class="ftable-wrap"><table class="ftable"><thead><tr><th>File</th><th>Status</th><th>Size</th></tr></thead><tbody>
      <tr><td><code>${esc(sku)}_en.html</code></td><td>Included</td><td></td></tr>
      ${list.map(f => `<tr><td><code>assets/img/${esc(f.name)}</code></td><td>${f.kind === 'new' ? 'Included' : f.same ? 'Same as server file, skipped' : 'On server'}</td><td class="mono">${f.kind === 'new' ? mb(f.asset.blob.size) : ''}</td></tr>`).join('')}
    </tbody></table></div>`;
  $('#exBody').querySelectorAll('[data-go]').forEach(btn => btn.onclick = () => { $('#modal').hidden = true; select(checks[+btn.dataset.go].bid, true); });
  const on = $('#optOn'), row = $('#exBody .optrow');
  on.onchange = () => { O.on = on.checked; row.hidden = !on.checked; };
  $('#optW').onchange = e => O.maxW = e.target.value;
  $('#optQ').oninput = e => { O.q = e.target.value; $('#optQv').textContent = e.target.value; };
  $('#exStatus').textContent = '';
  $('#modal').hidden = false; $('#exZip').focus();
}
$('#exportBtn').onclick = openExport;
$('#exClose').onclick = () => $('#modal').hidden = true;
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') $('#modal').hidden = true; });
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('#modal').hidden = true; });

$('#exHtml').onclick = async () => {
  const sku = (st.sku || 'page').trim();
  try { await saveFile(sku + '_en.html', buildHTML(st, assets, {}).html); $('#exStatus').textContent = 'Saved ' + sku + '_en.html'; }
  catch (e) { $('#exStatus').textContent = saveMsg(e); }
};
$('#exZip').onclick = async () => {
  const sku = (st.sku || 'page').trim(), { html, files } = buildHTML(st, assets, {}), O = st.optimise || {};
  if (!window.JSZip) { $('#exStatus').textContent = 'The zip tool did not load. Reload the page and try again.'; return; }
  $('#exStatus').textContent = O.on ? 'Optimising images…' : 'Building zip…';
  const zip = new JSZip(); zip.file(sku + '_en.html', html);
  let before = 0, after = 0;
  for (const f of files.values()) if (f.kind === 'new') {
    let blob = f.asset.blob; before += blob.size;
    if (O.on) { try { blob = await optimise(blob, f.name, O); } catch (e) { blob = f.asset.blob; } }
    after += blob.size; zip.file('assets/img/' + f.name, blob);
  }
  const zb = await zip.generateAsync({ type: 'blob' });
  const saved = O.on && before ? ` Images ${mb(before)} → ${mb(after)}.` : '';
  try { await saveFile(sku + '_en.zip', zb); dirty = false; $('#exStatus').textContent = 'Saved ' + sku + '_en.zip.' + saved; }
  catch (e) { $('#exStatus').textContent = saveMsg(e) + saved; }
};

/* ---------- Import a live PDP page (.html) into editable sections ---------- */
function importPdp(html, fname) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  // HTML collapses whitespace; do the same so line breaks in the source don't become line breaks in text.
  const tw = doc.createTreeWalker(doc.body, NodeFilter.SHOW_TEXT); while (tw.nextNode()) tw.currentNode.nodeValue = tw.currentNode.nodeValue.replace(/\s+/g, ' ');
  const file = img => img ? decodeURIComponent((img.getAttribute('src') || '').split(/[?#]/)[0].split('/').pop()) : '';
  const md = el => rteToMd(el).split('\n').map(l => l.trim()).join('\n').replace(/\n{3,}/g, '\n\n').trim();
  const unbold = v => v.replace(/^\*\*([\s\S]*)\*\*$/, '$1');
  const resp = root => {
    const any = root.querySelector('img'), d = file(root.querySelector('img.desktop') || any), t = file(root.querySelector('img.tablet')), m = file(root.querySelector('img.mobile'));
    return { desk: S(d), tab: S(t && t !== d ? t : ''), mob: S(m && m !== (t || d) ? m : ''), alt: (any && any.getAttribute('alt')) || '' };
  };
  const toEl = (node, opt) => {
    opt = opt || {};
    if (node.nodeType !== 1 || node.matches('br, script, style')) return null;
    const img = node.matches('img') ? node : (node.children.length === 1 && node.firstElementChild.matches('img') && !node.textContent.trim() ? node.firstElementChild : null);
    if (img) {
      const t = node.matches('.livara-icon, .livara-icon *') ? 'icon' : /logo/i.test(node.className + ' ' + img.className) ? 'logo' : 'image';
      return newEl(t, img.getAttribute('alt') || '', { img: S(file(img)) });
    }
    const v = md(node); if (!v) return null;
    const c = node.className || '';
    if (/\bfont-xlg\b/.test(c)) return newEl('headline', unbold(v));
    if (/\b(bold|font-bold|bold-title|livara-details-title)\b/.test(c) || (/^\*\*[\s\S]*\*\*$/.test(v) && !v.includes('\n'))) {
      const e = newEl('title', unbold(v)); if (/\bfont-md\b/.test(c)) e.style = { size: 'md' }; return e;
    }
    const e = newEl('text', v), sz = (c.match(/\bfont-(xs|sm|lg)\b/) || [])[1];
    if (sz && !opt.plain) e.style = { size: sz };
    if (/\bbold\b/.test(c)) e.style = Object.assign(e.style || {}, { weight: 'bold' });
    return e;
  };
  const kids = el => [...el.children].map(n => toEl(n)).filter(Boolean);
  const blocks = [];
  const push = (type, data) => blocks.push({ id: uid(), type, data });
  const secs = [...doc.body.children].filter(n => n.nodeType === 1 && !n.matches('script, style, link, noscript'));
  secs.forEach((sec, idx) => {
    const q = s => sec.matches(s) ? sec : sec.querySelector(s);
    if (q('.livara-banner-description')) {
      const r = resp(sec.querySelector('.w-100') || sec), dsc = q('.livara-banner-description'), seen = new Set(), els = [];
      dsc.querySelectorAll('.livara-banner-description-logo img').forEach(img => { const f = file(img); if (!seen.has(f)) { seen.add(f); els.push(newEl('logo', img.getAttribute('alt') || '', { img: S(f) })); } });
      dsc.querySelectorAll('.livara-banner-description-slogan').forEach(s => { const v = unbold(md(s)); if (v) els.push(newEl('title', v)); });
      return push('hero', { desk: r.desk, tab: r.tab, mob: r.mob, els, pos: { mode: 'custom', layout: 'logo-left', logoW: '30', h: 'left', v: 'middle', pad: ['4', '8', '4', '8'], tm: { h: 'center', v: 'middle', pad: ['', '', '', ''] } } });
    }
    if (q('.video-section iframe, iframe[src*="youtube"]')) return push('video', { url: q('iframe').getAttribute('src') || '' });
    if (q('.livara-details-column, .livara-details-column-reverse')) {
      const rows = [...sec.querySelectorAll('.livara-details-column, .livara-details-column-reverse')];
      return push('features', { startRev: rows[0].classList.contains('livara-details-column-reverse'), items: rows.map(row => {
        const det = row.querySelector('.livara-details'), pic = row.querySelector('.livara-product-img');
        return { id: uid('i'), els: det ? kids(det) : [], media: pic ? [...pic.querySelectorAll('img')].map(img => newEl('image', img.getAttribute('alt') || '', { img: S(file(img)) })) : [] };
      }) });
    }
    if (q('.more-info')) {
      const mi = q('.more-info');
      return push('moreinfo', { title: md(mi.querySelector('.info-title') || doc.createElement('i')) || 'MORE INFORMATION', items: [...mi.querySelectorAll('.info-content-item')].map(it => {
        const ttl = it.querySelector('.title'), title = ttl ? unbold(md(ttl)) : '', specs = [...it.querySelectorAll('table tr')].map(tr => [...tr.children].map(td => md(td)).join(' | ')).join('\n');
        const c = it.cloneNode(true); c.querySelectorAll('.title, table').forEach(x => x.remove());
        return { id: uid('i'), title, body: md(c), specs };
      }) });
    }
    // One template section can hold both the brand profile and the brand strip.
    let got = false;
    if (q('.livara-profile')) { push('profile', { els: kids(q('.livara-profile')) }); got = true; }
    if (q('.livara-brand')) {
      const br = q('.livara-brand'), els = [];
      [...br.children].forEach(n => { const im = n.querySelector && n.querySelector('img'); if (im && !n.textContent.trim()) els.push(newEl('logo', im.getAttribute('alt') || '', { img: S(file(im)) })); else { const e = toEl(n); if (e) els.push(e); } });
      push('brand', { els }); got = true;
    }
    if (got) return;
    if (q('.livara-desc')) return push('intro', { els: kids(q('.livara-desc')) });
    // Image-only sections: responsive banner/image.
    if (sec.querySelector('img') && !sec.textContent.trim() && sec.querySelectorAll('img').length <= 3) {
      const r = resp(sec), after = blocks.some(x => x.type === 'moreinfo');
      return push(after || idx === secs.length - 1 ? 'banner' : 'image', r);
    }
    push('raw', { html: sec.outerHTML });
  });
  const ns = st;
  st = blankState();
  st.title = (doc.querySelector('title') || {}).textContent || '';
  st.desc = (doc.querySelector('meta[name="description"]') || { getAttribute: () => '' }).getAttribute('content') || '';
  st.kw = (doc.querySelector('meta[name="keywords"]') || { getAttribute: () => '' }).getAttribute('content') || '';
  st.sku = ((fname || '').match(/(\d{4,})/) || html.match(/assets\/img\/(\d{4,})_PDP_/) || [])[1] || '';
  st.blocks = blocks;
  for (const k of Object.keys(assets)) if (!JSON.stringify(ns).includes(k)) { /* keep uploads for undo */ }
  skuIn.value = st.sku; selId = st.blocks[0]?.id || null; tab = 'block'; renderAll(); commitSnap();
  const raw = blocks.filter(b => b.type === 'raw').length;
  toast(`Imported ${blocks.length} section${blocks.length === 1 ? '' : 's'}${raw ? ` (${raw} as Custom HTML)` : ''}. Undo brings back your previous page.`);
}

/* ---------- Project save / open (keeps uploads inside the .json) ---------- */
const toDataURL = blob => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = no; r.readAsDataURL(blob); });
function fromDataURL(u) { const [h, b64] = u.split(','); const bin = atob(b64), a = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return new Blob([a], { type: h.slice(5).split(';')[0] }); }
// Project file = a normal .html page you can open in a browser to look at, with the editable project embedded inside it.
const PROJ_ID = 'pdp-builder-project';
$('#saveProject').onclick = async () => {
  const used = {}, view = {};
  for (const [k, a] of Object.entries(assets)) if (JSON.stringify(st).includes('"' + k + '"')) { const data = await toDataURL(a.blob); used[k] = { name: a.name, type: a.type, data }; view[k] = { name: a.name, url: data }; }
  const data = JSON.stringify({ app: 'pdp-builder', v: 1, state: st, assets: used }).replace(/</g, '\\u003c');
  const page = buildHTML(st, view, { preview: true, clean: true }).html
    .replace('<head>', `<head><title>${esc(st.title || st.sku || 'PDP')} · PDP Builder project</title><meta name="generator" content="PDP Builder">`)
    .replace('</body>', `<script type="application/json" id="${PROJ_ID}">${data}<\/script>\n</body>`);
  try { await saveFile((st.sku || 'page') + '_project.html', page); dirty = false; toast('Project saved'); }
  catch (e) { toast(saveMsg(e)); }
};
$('#openProject').addEventListener('change', async e => {
  const file = e.target.files[0]; e.target.value = ''; if (!file) return;
  try {
    const txt = await file.text();
    const m = txt.match(new RegExp(`<script type="application/json" id="${PROJ_ID}">([\\s\\S]*?)<\/script>`));
    if (!m && /<(section|body)[\s>]/i.test(txt) && !/^\s*\{/.test(txt)) { importPdp(txt, file.name); return; }
    const p = JSON.parse(m ? m[1] : txt);
    if (p.app !== 'pdp-builder' || !p.state || !Array.isArray(p.state.blocks)) throw 0;
    for (const k of Object.keys(assets)) { URL.revokeObjectURL(assets[k].url); delete assets[k]; }
    for (const [k, a] of Object.entries(p.assets || {})) { const blob = fromDataURL(a.data); assets[k] = { name: a.name, type: a.type, blob, url: URL.createObjectURL(blob) }; }
    st = migrate(p.state); st.colors = Object.assign(Object.fromEntries(COLOR_KEYS.map(([k, v]) => [k, v])), st.colors || {});
    skuIn.value = st.sku; selId = st.blocks[0]?.id || null; tab = 'block'; hist.past = []; hist.future = []; hist.cur = null; renderAll(); commitSnap(); toast('Project opened');
  } catch (err) { console.error(err); toast('That file is not a PDP Builder project or a PDP page.'); }
});

document.querySelectorAll('i[data-ico]').forEach(i => i.outerHTML = ico(i.dataset.ico));
// Light / dark switch, remembered on this device; defaults to the system setting.
const themeBtn = $('#themeBtn');
const applyTheme = th => { if (th) document.documentElement.dataset.theme = th; else delete document.documentElement.dataset.theme; const dark = th ? th === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; themeBtn.innerHTML = ico(dark ? 'sun' : 'moon'); };
let theme = null; try { theme = localStorage.getItem('pdpTheme'); } catch (e) {}
applyTheme(theme);
themeBtn.onclick = () => { const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; theme = dark ? 'light' : 'dark'; try { localStorage.setItem('pdpTheme', theme); } catch (e) {} document.body.classList.add('theming'); applyTheme(theme); setTimeout(() => document.body.classList.remove('theming'), 400); };
const gridBtn = $('#gridBtn');
const setGrid = on => { gridOn = on; gridBtn.setAttribute('aria-pressed', on); try { localStorage.setItem('pdpGrid', on ? '1' : '0'); } catch (e) {} renderPreview(); };
gridBtn.setAttribute('aria-pressed', gridOn); gridBtn.onclick = () => setGrid(!gridOn);
document.addEventListener('keydown', e => { if (e.key.toLowerCase() === 'g' && !e.ctrlKey && !e.metaKey && !e.altKey && !e.target.closest('input, textarea, select, [contenteditable]')) setGrid(!gridOn); });
$('#undoBtn').onclick = undo; $('#redoBtn').onclick = redo;
renderLib(); renderAll(); fit(); commitSnap();
offerRestore();
