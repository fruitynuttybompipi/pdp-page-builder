<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PDP Page Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: three-pane workbench. Outline left, live preview centre, inspector right; stacks on phones. */
:root {
  --bg: #f4f1ec; --surface: #ffffff; --raised: #faf8f5; --line: #e2dbd2; --fg: #221c16;
  --muted: #6e6359; --accent: #9a5d22; --accent-soft: #f3e6d8; --accent-fg: #ffffff;
  --stage: #e7e2db; --ok: #2f7a4a; --warn: #a3620b; --danger: #b3362b;
  --sans: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #16130f; --surface: #201c17; --raised: #26211b; --line: #3a322a; --fg: #efe8df;
  --muted: #a79a8c; --accent: #d79a5c; --accent-soft: #3a2b1d; --accent-fg: #1b130b;
  --stage: #0e0c0a; --ok: #6cc28f; --warn: #e2a64f; --danger: #ec7b70; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #16130f; --surface: #201c17; --raised: #26211b; --line: #3a322a; --fg: #efe8df;
  --muted: #a79a8c; --accent: #d79a5c; --accent-soft: #3a2b1d; --accent-fg: #1b130b;
  --stage: #0e0c0a; --ok: #6cc28f; --warn: #e2a64f; --danger: #ec7b70; color-scheme: dark }

* { box-sizing: border-box }
html, body { height: 100% }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 var(--sans) }
button, input, textarea, select { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
code, .mono { font-family: var(--mono); font-size: 12px }

.app { height: 100%; display: grid; grid-template-rows: auto 1fr }
header.bar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--line); background: var(--surface);
}
.brand { font-weight: 700; letter-spacing: .01em; display: flex; align-items: baseline; gap: 8px }
.brand small { color: var(--muted); font-weight: 500 }
.sku { display: flex; align-items: center; gap: 8px }
.sku label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600 }
.sku input { width: 110px; font-family: var(--mono); font-size: 14px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--raised) }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden }
.seg button { border: 0; background: transparent; padding: 6px 10px; color: var(--muted) }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--fg); font-weight: 600 }
.spacer { flex: 1 }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 7px; padding: 6px 12px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap }
.btn:hover { border-color: var(--muted) }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 600 }
.btn.sm { padding: 3px 8px; font-size: 12px }
.btn.ghost { border-color: transparent; background: transparent }
.btn.danger { color: var(--danger) }

.work { min-height: 0; display: grid; grid-template-columns: 260px minmax(0, 1fr) 360px }
.pane { min-height: 0; overflow: auto; background: var(--surface) }
.left { border-right: 1px solid var(--line) }
.right { border-left: 1px solid var(--line) }
.pane h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); margin: 0; padding: 14px 14px 8px; font-weight: 700 }

.lib { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 0 12px 12px }
.chip { border: 1px dashed var(--line); background: var(--raised); border-radius: 7px; padding: 7px 8px; text-align: left; font-size: 12.5px; line-height: 1.25; cursor: grab }
.chip:hover { border-color: var(--accent); border-style: solid }
.hint { color: var(--muted); font-size: 12px; padding: 0 14px 10px; margin: 0 }

.outline { list-style: none; margin: 0; padding: 0 8px 16px; position: relative; min-height: 60px }
.row { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; align-items: center; gap: 6px; padding: 7px 6px; border-radius: 7px; border: 1px solid transparent; cursor: pointer; margin-bottom: 2px }
.row:hover { background: var(--raised) }
.row.sel { background: var(--accent-soft); border-color: var(--accent) }
.row .grip { color: var(--muted); cursor: grab; font-size: 13px; text-align: center; user-select: none }
.row .lbl { min-width: 0 }
.row .t { font-weight: 600; font-size: 13px }
.row .s { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.row .acts { display: flex; gap: 0; opacity: .55 }
.row:hover .acts, .row.sel .acts { opacity: 1 }
.row .acts button { border: 0; background: transparent; padding: 2px 4px; color: var(--muted); font-size: 13px; border-radius: 4px }
.row .acts button:hover { color: var(--fg); background: var(--surface) }
.drop-line { height: 3px; background: var(--accent); border-radius: 2px; margin: -1px 4px 1px }
.row.dragging { opacity: .4 }

.center { min-height: 0; display: grid; grid-template-rows: auto 1fr; background: var(--stage) }
.stagebar { display: flex; align-items: center; gap: 10px; padding: 8px 14px; color: var(--muted); font-size: 12px; border-bottom: 1px solid var(--line); background: var(--surface) }
.stage { min-height: 0; overflow: hidden; position: relative; padding: 16px }
.frame-wrap { margin: 0 auto; transform-origin: top left; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 8px 30px rgba(0,0,0,.08) }
.frame-wrap iframe { display: block; border: 0; background: #fff }

.tabs { display: flex; gap: 4px; padding: 10px 12px 0; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--surface); z-index: 2 }
.tabs button { border: 0; background: transparent; padding: 8px 10px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; font-weight: 600 }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent) }
.insp { padding: 14px; display: flex; flex-direction: column; gap: 14px }
.insp .blockhead { display: flex; align-items: baseline; justify-content: space-between; gap: 8px }
.insp .blockhead h3 { margin: 0; font-size: 16px }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0 }
.field > label, .field > .flabel { font-size: 12px; font-weight: 600 }
.field .fhint { font-size: 11.5px; color: var(--muted) }
.field input[type=text], .field textarea, .field input[type=url] { width: 100%; border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; background: var(--raised) }
.field textarea { min-height: 96px; resize: vertical; line-height: 1.45 }
.check { display: flex; gap: 8px; align-items: center; font-size: 13px }

.slot { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 10px; padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--raised) }
.slot.over { border-color: var(--accent); background: var(--accent-soft) }
.thumb { width: 76px; height: 64px; border-radius: 5px; overflow: hidden; background: var(--stage); display: grid; place-items: center; color: var(--muted); font-size: 11px; text-align: center }
.thumb img { width: 100%; height: 100%; object-fit: contain }
.slot .meta { min-width: 0; display: flex; flex-direction: column; gap: 4px }
.slot .top { display: flex; align-items: center; gap: 6px; flex-wrap: wrap }
.slot .fl { font-size: 12px; font-weight: 600 }
.badge { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; padding: 1px 6px; border-radius: 99px; border: 1px solid currentColor }
.badge.new { color: var(--ok) } .badge.existing { color: var(--muted) } .badge.empty { color: var(--warn) }
.slot code { overflow-wrap: anywhere; color: var(--fg) }
.slot .acts { display: flex; gap: 6px; flex-wrap: wrap }
.slot .fn { width: 100%; border: 1px solid var(--line); border-radius: 5px; padding: 4px 7px; background: var(--surface); font-family: var(--mono); font-size: 11.5px }

details.item { border: 1px solid var(--line); border-radius: 8px; background: var(--surface) }
details.item > summary { display: flex; align-items: center; gap: 8px; padding: 8px 10px; cursor: pointer; list-style: none }
details.item > summary::-webkit-details-marker { display: none }
details.item > summary .n { font-family: var(--mono); font-size: 11px; color: var(--muted) }
details.item > summary .tt { flex: 1; min-width: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
details.item > summary button { border: 0; background: transparent; color: var(--muted); padding: 2px 5px; border-radius: 4px }
details.item > summary button:hover { color: var(--fg); background: var(--raised) }
details.item[open] > summary { border-bottom: 1px solid var(--line) }
details.item .body { padding: 10px; display: flex; flex-direction: column; gap: 12px }
.list { display: flex; flex-direction: column; gap: 8px }

.colors { display: grid; grid-template-columns: 1fr; gap: 8px }
.colorrow { display: grid; grid-template-columns: 36px minmax(0, 1fr) 88px; align-items: center; gap: 8px; font-size: 12.5px }
.colorrow input[type=color] { width: 36px; height: 28px; border: 1px solid var(--line); border-radius: 5px; padding: 0; background: none }
.colorrow input[type=text] { font-family: var(--mono); font-size: 12px; border: 1px solid var(--line); border-radius: 5px; padding: 4px 6px; background: var(--raised); width: 100% }
.cheat { font-size: 12px; color: var(--muted); background: var(--raised); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; line-height: 1.6 }
.cheat code { color: var(--fg) }

.modal { position: fixed; inset: 0; background: rgba(20,14,8,.45); display: grid; place-items: center; z-index: 20; padding: 16px }
.dialog { width: min(720px, 100%); max-height: 88vh; overflow: auto; background: var(--surface); border-radius: 12px; border: 1px solid var(--line); padding: 20px; display: flex; flex-direction: column; gap: 14px }
.dialog h3 { margin: 0; font-size: 18px }
.ftable-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px }
.ftable { width: 100%; border-collapse: collapse; font-size: 12.5px }
.ftable th, .ftable td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--line); vertical-align: top }
.ftable th { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted) }
.ftable tr:last-child td { border-bottom: 0 }
.warns { margin: 0; padding: 10px 12px 10px 28px; border-radius: 8px; background: var(--accent-soft); color: var(--fg); font-size: 13px }
.dialog .acts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end }
.status { font-size: 12.5px; color: var(--muted); min-height: 1.2em }

.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 13px; z-index: 30 }

@media (max-width: 1100px) { .work { grid-template-columns: 230px minmax(0, 1fr) 320px } }
@media (max-width: 900px) {
  .app { height: auto; display: block }
  .work { display: flex; flex-direction: column }
  .pane { overflow: visible }
  .left, .right { border: 0; border-bottom: 1px solid var(--line) }
  .center { height: 72vh; order: 0 }
  .left { order: 1 } .right { order: 2 }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important } }
</style>

</head>
<body>
<div class="app">
  <header class="bar">
    <div class="brand">PDP Builder <small>Amway PDP template</small></div>
    <div class="sku"><label for="sku">SKU</label><input id="sku" type="text" inputmode="numeric" autocomplete="off"></div>
    <div class="seg" role="group" aria-label="Preview width">
      <button data-dev="desktop" aria-pressed="true">Desktop</button>
      <button data-dev="tablet" aria-pressed="false">Tablet</button>
      <button data-dev="mobile" aria-pressed="false">Mobile</button>
    </div>
    <div class="spacer"></div>
    <label class="btn" for="openProject">Open project<input id="openProject" type="file" accept=".json,application/json" hidden></label>
    <button class="btn" id="saveProject">Save project</button>
    <button class="btn primary" id="exportBtn">Export</button>
  </header>

  <div class="work">
    <aside class="pane left">
      <h2>Add a section</h2>
      <p class="hint">Drag into the page list, or click to add below the selected section.</p>
      <div class="lib" id="lib"></div>
      <h2>Page</h2>
      <ol class="outline" id="outline"></ol>
    </aside>

    <main class="center">
      <div class="stagebar"><span id="stageInfo"></span><span class="spacer"></span><span>Click a section in the preview to edit it</span></div>
      <div class="stage" id="stage"><div class="frame-wrap" id="frameWrap"><iframe id="frame" title="Page preview"></iframe></div></div>
    </main>

    <aside class="pane right">
      <div class="tabs" role="tablist">
        <button role="tab" id="tabBlock" aria-selected="true">Section</button>
        <button role="tab" id="tabPage" aria-selected="false">Page settings</button>
      </div>
      <div class="insp" id="insp"></div>
    </aside>
  </div>
</div>

<div class="modal" id="modal" hidden>
  <div class="dialog" role="dialog" aria-labelledby="exTitle">
    <h3 id="exTitle">Export</h3>
    <div id="exBody"></div>
    <div class="status" id="exStatus"></div>
    <div class="acts">
      <button class="btn" id="exClose">Close</button>
      <button class="btn" id="exHtml">Save HTML only</button>
      <button class="btn primary" id="exZip">Save .zip</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<script>
/* ---------- App state ---------- */
let st = defaultState();
const assets = {};          // key -> {name, type, blob, url}
let selId = st.blocks[0].id, tab = 'block', device = 'desktop';
const openItems = new Set();
const $ = s => document.querySelector(s);
const DEV = { desktop: 1366, tablet: 834, mobile: 390 };

function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2600); }
const findBlock = id => st.blocks.find(b => b.id === id);

/* ---------- Preview ---------- */
const frame = $('#frame'), wrap = $('#frameWrap'), stage = $('#stage');
let pvTimer, scrollToSel = false, lastScroll = 0;
function schedulePreview(now) { clearTimeout(pvTimer); pvTimer = setTimeout(renderPreview, now ? 0 : 220); }
function renderPreview() {
  try { lastScroll = frame.contentWindow ? frame.contentWindow.scrollY : 0; } catch (e) { lastScroll = 0; }
  frame.srcdoc = buildHTML(st, assets, { preview: true, sel: selId }).html;
}
frame.addEventListener('load', () => {
  let doc; try { doc = frame.contentDocument; } catch (e) { return; }
  if (!doc) return;
  if (scrollToSel && selId) { const el = doc.querySelector(`[data-bid="${selId}"]`); if (el) el.scrollIntoView({ block: 'start' }); scrollToSel = false; }
  else frame.contentWindow.scrollTo(0, lastScroll);
  doc.addEventListener('click', e => {
    if (e.target.closest('a')) e.preventDefault();
    const el = e.target.closest('[data-bid]'); if (el) select(el.dataset.bid, false);
  });
});
function fit() {
  const w = DEV[device], avail = stage.clientWidth - 32, s = Math.min(1, avail / w);
  wrap.style.width = w + 'px'; wrap.style.transform = `scale(${s})`;
  frame.style.width = w + 'px'; frame.style.height = Math.max(300, (stage.clientHeight - 32) / s) + 'px';
  wrap.style.marginLeft = Math.max(0, (avail - w * s) / 2) + 'px';
  $('#stageInfo').textContent = `${device[0].toUpperCase() + device.slice(1)} · ${w}px${s < 1 ? ' · shown at ' + Math.round(s * 100) + '%' : ''}`;
}
new ResizeObserver(fit).observe(stage);
document.querySelectorAll('[data-dev]').forEach(b => b.addEventListener('click', () => {
  device = b.dataset.dev; document.querySelectorAll('[data-dev]').forEach(x => x.setAttribute('aria-pressed', x === b)); fit();
}));

/* ---------- Library & outline ---------- */
function renderLib() {
  $('#lib').innerHTML = ORDER.map(t => `<button class="chip" draggable="true" data-new="${t}">${TYPES[t].label}</button>`).join('');
  $('#lib').querySelectorAll('.chip').forEach(c => {
    c.addEventListener('dragstart', e => { e.dataTransfer.setData('text/x-new', c.dataset.new); e.dataTransfer.effectAllowed = 'copy'; });
    c.addEventListener('click', () => { const i = st.blocks.findIndex(b => b.id === selId); addBlock(c.dataset.new, i < 0 ? st.blocks.length : i + 1); });
  });
}
function addBlock(type, at) {

  st.blocks.splice(at, 0, b); scrollToSel = true; select(b.id, true); toast(TYPES[type].label + ' added');
}
function renderOutline() {
  const ol = $('#outline');
  ol.innerHTML = st.blocks.map((b, i) => `<li class="row${b.id === selId ? ' sel' : ''}" draggable="true" data-id="${b.id}">
    <span class="grip" aria-hidden="true">⋮⋮</span>
    <span class="lbl"><div class="t">${esc(TYPES[b.type].label)}</div><div class="s">${esc(TYPES[b.type].sum(b.data))}</div></span>
    <span class="acts">
      <button data-act="up" title="Move up" aria-label="Move up" ${i === 0 ? 'disabled' : ''}>↑</button>
      <button data-act="down" title="Move down" aria-label="Move down" ${i === st.blocks.length - 1 ? 'disabled' : ''}>↓</button>
      <button data-act="dup" title="Duplicate" aria-label="Duplicate">⧉</button>
      <button data-act="del" title="Delete" aria-label="Delete">✕</button>

  ol.querySelectorAll('.row').forEach(r => {
    const id = r.dataset.id;
    r.addEventListener('click', e => {
      const act = e.target.closest('button')?.dataset.act; const i = st.blocks.findIndex(b => b.id === id);
      if (!act) return select(id, true);
      e.stopPropagation();
      if (act === 'up' && i > 0) [st.blocks[i - 1], st.blocks[i]] = [st.blocks[i], st.blocks[i - 1]];
      if (act === 'down' && i < st.blocks.length - 1) [st.blocks[i + 1], st.blocks[i]] = [st.blocks[i], st.blocks[i + 1]];
      if (act === 'dup') { const c = JSON.parse(JSON.stringify(st.blocks[i])); c.id = uid(); (c.data.items || []).forEach(it => it.id = uid('i')); st.blocks.splice(i + 1, 0, c); selId = c.id; }
      if (act === 'del') { st.blocks.splice(i, 1); if (selId === id) selId = (st.blocks[i] || st.blocks[i - 1] || {}).id || null; toast('Section deleted'); }
      renderAll();
    });
    r.addEventListener('dragstart', e => { e.dataTransfer.setData('text/x-move', id); e.dataTransfer.effectAllowed = 'move'; r.classList.add('dragging'); });
    r.addEventListener('dragend', () => { r.classList.remove('dragging'); clearLine(); });
  });
}
let line;
function clearLine() { line && line.remove(); line = null; }
function dropIndex(y) {
  const rows = [...$('#outline').querySelectorAll('.row')];
  for (let i = 0; i < rows.length; i++) { const r = rows[i].getBoundingClientRect(); if (y < r.top + r.height / 2) return i; }
  return rows.length;
}
const outlineEl = $('#outline');
outlineEl.addEventListener('dragover', e => {
  const types = [...e.dataTransfer.types]; if (!types.includes('text/x-new') && !types.includes('text/x-move')) return;
  e.preventDefault(); const i = dropIndex(e.clientY), rows = outlineEl.querySelectorAll('.row');
  if (!line) { line = document.createElement('div'); line.className = 'drop-line'; }
  if (rows[i]) outlineEl.insertBefore(line, rows[i]); else outlineEl.appendChild(line);
});
outlineEl.addEventListener('dragleave', e => { if (!outlineEl.contains(e.relatedTarget)) clearLine(); });
outlineEl.addEventListener('drop', e => {
  e.preventDefault(); const i = dropIndex(e.clientY); clearLine();

/* ---------- Inspector ---------- */

function fieldEl(f, obj, ref, names, b) {

}

      </div>
      <label for="${fnId}" style="font-size:11px;color:var(--muted)">${slot.a ? 'Filename (leave blank for automatic)' : 'Or use a file already on the server'}</label>
      <input class="fn" id="${fnId}" type="text" placeholder="${esc(slot.a ? auto : 'e.g. ' + (auto || 'brand_PDP_logo.png'))}">
    </div>`;
  const fn = el.querySelector('.fn'); fn.value = slot.name;
  fn.addEventListener('change', () => { slot.name = fn.value.trim(); renderInspector(); schedulePreview(); });
  const take = file => {
    if (!file || !/^image\//.test(file.type)) return toast('That file is not an image.');
    const key = uid('a'); assets[key] = { name: file.name, type: file.type, blob: file, url: URL.createObjectURL(file) };
    slot.a = key; slot.name = ''; renderAll();
  };
  el.querySelector('input[type=file]').addEventListener('change', e => take(e.target.files[0]));
  el.querySelector('[data-clear]')?.addEventListener('click', () => { slot.a = null; slot.name = ''; renderAll(); });
  el.addEventListener('dragover', e => { if ([...e.dataTransfer.types].includes('Files')) { e.preventDefault(); el.classList.add('over'); } });
  el.addEventListener('dragleave', () => el.classList.remove('over'));
  el.addEventListener('drop', e => { e.preventDefault(); el.classList.remove('over'); take(e.dataTransfer.files[0]); });
  return el;
}

function renderPage(box) {
  const mk = (lbl, key, area, hint) => {
    const d = document.createElement('div'); d.className = 'field'; const id = fid();
    d.innerHTML = `<label for="${id}">${lbl}</label>${area ? `<textarea id="${id}" rows="4"></textarea>` : `<input type="text" id="${id}">`}${hint ? `<div class="fhint">${hint}</div>` : ''}`;
    const i = d.querySelector('input,textarea'); i.value = st[key]; i.addEventListener('input', () => { st[key] = i.value; }); box.appendChild(d);
  };
  mk('Page title', 'title', false, 'Shown in the browser tab.');
  mk('Meta description', 'desc', true, 'Shown by search engines and link previews. About 150 characters.');
  mk('Meta keywords', 'kw', false, 'Comma separated.');
  const c = document.createElement('div'); c.className = 'field';
  c.innerHTML = '<div class="flabel">Brand colours</div><div class="colors"></div><div><button class="btn sm ghost">Reset to LIVARA colours</button></div>';
  const g = c.querySelector('.colors');
  COLOR_KEYS.forEach(([k, def, lbl]) => {
    const row = document.createElement('div'); row.className = 'colorrow'; const id = fid();
    row.innerHTML = `<input type="color" id="${id}" aria-label="${esc(lbl)}"><label for="${id}">${esc(lbl)}</label><input type="text" aria-label="${esc(lbl)} hex">`;
    const [pick, , hex] = row.children; pick.value = hex.value = st.colors[k];
    const set = v => { if (!/^#[0-9a-f]{6}$/i.test(v)) return; st.colors[k] = v.toUpperCase(); pick.value = v; hex.value = v.toUpperCase(); schedulePreview(); };
    pick.addEventListener('input', () => set(pick.value)); hex.addEventListener('change', () => set(hex.value.trim()));
    g.appendChild(row);
  });
  c.querySelector('button').onclick = () => { st.colors = Object.fromEntries(COLOR_KEYS.map(([k, v]) => [k, v])); renderInspector(); schedulePreview(); };
  box.appendChild(c);
}

function renderAll() { renderOutline(); renderInspector(); schedulePreview(); }

/* ---------- SKU ---------- */
const skuIn = $('#sku'); skuIn.value = st.sku;
skuIn.addEventListener('input', () => { st.sku = skuIn.value.trim(); renderInspector(); schedulePreview(); });

/* ---------- Saving files ---------- */
let dl;
async function saveFile(filename, data) {
  if (dl === undefined) dl = window.claude ? await window.claude.use('downloads').catch(() => null) : null;
  if (dl) return dl.save({ filename, data });
  // Outside claude.ai (e.g. GitHub Pages): plain browser download.
  const url = URL.createObjectURL(data instanceof Blob ? data : new Blob([data]));
  const a = document.createElement('a'); a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  return { status: 'saved' };
}
const saveMsg = e => ({ declined: 'Save cancelled.', rate_limited: 'Another save is waiting. Try again in a moment.', too_large: 'The file is too large to save here.' }[e && e.code] || 'Saving files is not available in this view. Open the page in claude.ai.');

function openExport() {
  const { files, warns } = buildHTML(st, assets, {});
  const list = [...files.values()].sort((a, b) => a.name.localeCompare(b.name));
  const sku = (st.sku || 'page').trim();
  $('#exBody').innerHTML = `
    ${warns.length ? `<ul class="warns">${warns.map(w => `<li>${esc(w)}</li>`).join('')}</ul>` : ''}
    <p style="margin:0">The .zip holds <code>${esc(sku)}_en.html</code> and <code>assets/img/</code> with your new uploads. Files marked <b>On server</b> are referenced but not included, because they already exist there. Your existing <code>assets/css/artistry.css</code> and <code>assets/js/</code> files are referenced, not included.</p>
    <div class="ftable-wrap"><table class="ftable"><thead><tr><th>File</th><th>Status</th></tr></thead><tbody>
      <tr><td><code>${esc(sku)}_en.html</code></td><td>Included</td></tr>
      ${list.map(f => `<tr><td><code>assets/img/${esc(f.name)}</code></td><td>${f.kind === 'new' ? 'Included' : 'On server'}</td></tr>`).join('')}
    </tbody></table></div>`;
  $('#exStatus').textContent = '';
  $('#modal').hidden = false; $('#exZip').focus();
}
$('#exportBtn').onclick = openExport;
$('#exClose').onclick = () => $('#modal').hidden = true;
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') $('#modal').hidden = true; });
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('#modal').hidden = true; });

$('#exHtml').onclick = async () => {
  const sku = (st.sku || 'page').trim();
  try { await saveFile(sku + '_en.html', buildHTML(st, assets, {}).html); $('#exStatus').textContent = 'Saved ' + sku + '_en.html'; }
  catch (e) { $('#exStatus').textContent = saveMsg(e); }
};
$('#exZip').onclick = async () => {
  const sku = (st.sku || 'page').trim(), { html, files } = buildHTML(st, assets, {});
  if (!window.JSZip) { $('#exStatus').textContent = 'The zip tool did not load. Reload the page and try again.'; return; }
  $('#exStatus').textContent = 'Building zip…';
  const zip = new JSZip(); zip.file(sku + '_en.html', html);
  for (const f of files.values()) if (f.kind === 'new') zip.file('assets/img/' + f.name, f.asset.blob);
  const blob = await zip.generateAsync({ type: 'blob' });
  try { await saveFile(sku + '_en.zip', blob); $('#exStatus').textContent = 'Saved ' + sku + '_en.zip'; }
  catch (e) { $('#exStatus').textContent = saveMsg(e); }
};

/* ---------- Project save / open (keeps uploads inside the .json) ---------- */
const toDataURL = blob => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = no; r.readAsDataURL(blob); });
function fromDataURL(u) { const [h, b64] = u.split(','); const bin = atob(b64), a = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return new Blob([a], { type: h.slice(5).split(';')[0] }); }
$('#saveProject').onclick = async () => {
  const used = {};
  for (const [k, a] of Object.entries(assets)) if (JSON.stringify(st).includes('"' + k + '"')) used[k] = { name: a.name, type: a.type, data: await toDataURL(a.blob) };
  try { await saveFile((st.sku || 'page') + '_builder.json', JSON.stringify({ app: 'pdp-builder', v: 1, state: st, assets: used })); toast('Project saved'); }
  catch (e) { toast(saveMsg(e)); }
};
$('#openProject').addEventListener('change', async e => {
  const file = e.target.files[0]; e.target.value = ''; if (!file) return;
  try {
    const p = JSON.parse(await file.text());
    if (p.app !== 'pdp-builder' || !p.state || !Array.isArray(p.state.blocks)) throw 0;
    for (const k of Object.keys(assets)) { URL.revokeObjectURL(assets[k].url); delete assets[k]; }
    for (const [k, a] of Object.entries(p.assets || {})) { const blob = fromDataURL(a.data); assets[k] = { name: a.name, type: a.type, blob, url: URL.createObjectURL(blob) }; }
    st = p.state; st.colors = Object.assign(Object.fromEntries(COLOR_KEYS.map(([k, v]) => [k, v])), st.colors || {});
    skuIn.value = st.sku; selId = st.blocks[0]?.id || null; tab = 'block'; renderAll(); toast('Project opened');
  } catch (err) { toast('That file is not a PDP Builder project.'); }
});

renderLib(); renderAll(); fit();
</script>
